name: Hotelier CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Unit & Integration Tests, Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install All Dependencies (Root, Server & Client)
        run: |
          npm ci
          npm ci --prefix server
          npm ci --prefix client

      - name: Run Backend Vitest Unit & Security Tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: test-ci-jwt-secret-at-least-32-chars-long-12345

      - name: Build Production Client Assets
        run: npm run build

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: Execute Playwright E2E Smoke Tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
